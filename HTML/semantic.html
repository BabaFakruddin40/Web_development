<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standard way of creating a web page</title>
</head>
<body>
    <hgroup>
        <h1>Techustad</h1>
        <h2>Education</h2>
        <nav>
            <ul>
                <li><a href="#Home">Home</a></li>
                <li><a href="#About">About</a></li>
                <li><a href="#Contact">Contact</a></li>
            </ul>
        </nav>
    </hgroup>
    <main>
        <p>This is the main content of the page.</p>
    </main>
    <section>
        <p>This is a section of content that is semantically grouped together.</p>
    </section>
    <article>
        <p>This is an article of content that is semantically grouped together.</p>
    </article>
    <footer>
        <p> &copy; Techustad 2024.</p>
    </footer>
</body>
</html>
