<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation project</title>
    <link rel="stylesheet" href="nav.css">
</head>
<body>
        <div class="Horizontal-links">
        <h1>variation-1 with unordered list</h1>
        <nav title="variation-1 with unordered list">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
                <li><button type="submit">Login</button></li>
            </ul>
        </nav>
        </div>
        <div class="vertical-links">
        <h1>variation-2 with vertical links hover effect</h1>
        <nav title="variation-2 with vertical links hover effect">
            <div>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
                <button type="submit">Login</button>
            </div>
        </nav>
    </div>
    <div class="dropdown-menu">
        <h1>variation-3 with dropdown menu</h1>
        <nav title="variation-3 with dropdown menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <div>
                <a href="#">Services</a>
                <div>
                    <a href="#">Web Design</a>
                    <a href="#">SEO</a>
                </div>
            </div>
            <a href="#">Contact</a>
            <button type="submit">Login</button>
        </nav>
    </div>
</body>
</html>
