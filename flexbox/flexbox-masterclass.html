<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Masterclass</title>
    <link rel="stylesheet" href="flexbox.css">
</head>
<body>
    <h1>Flexbox Masterclass</h1>
    <div class="container">
        <h2>1. Default Flexbox</h2>
    <div class="flex-container">
        <div class="square pastel-1">Item 1</div>
        <div class="square pastel-2">Item 2</div>
        <div class="square pastel-3">Item 3</div>
        <div class="square pastel-4">Item 4</div>
    </div>
    </div>
    <div class="container">
        <h2>2. flex-direction: column</h2>
    <div class="flex-container flex-direction-column">
        <div class="square pastel-1">Item 1</div>
        <div class="square pastel-2">Item 2</div>
        <div class="square pastel-3">Item 3</div>
        <div class="square pastel-4">Item 4</div>
    </div>
    </div>
    <div class="container">
        <h2>3. flex-direction: row; justify-content: <space-around></space-around></h2>
    <div class="flex-container flex-direction-row justify-content-space-around">
        <div class="square pastel-1">Item 1</div>
        <div class="square pastel-2">Item 2</div>
        <div class="square pastel-3">Item 3</div>
        <div class="square pastel-4">Item 4</div>
    </div>
    </div>
    <div class="container">
        <h2>4. align-items: flex-stretch</h2>
    <div class="flex-container align-items-stretch">
        <div class="square pastel-1" style="align-self: stretch;">Item 1</div>
        <div class="square pastel-2" style="align-content: space-around;">Item 2</div>
        <div class="square pastel-3">Item 3</div>
        <div class="square pastel-4">Item 4</div>
    </div>
    </div>
</body>
</html>
